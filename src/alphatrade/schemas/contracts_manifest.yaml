version: 1
profiles:
  m4:
    description: "Mainline gate. 3-seed train+eval."
    reports_dir: "reports"
    items:
      - {name: m4_train_metrics_seed42, path: "m4_train_metrics_seed42.json", schema: "src/alphatrade/schemas/m2_train_metrics.schema.json", required: true}
      - {name: m4_train_metrics_seed43, path: "m4_train_metrics_seed43.json", schema: "src/alphatrade/schemas/m2_train_metrics.schema.json", required: true}
      - {name: m4_train_metrics_seed44, path: "m4_train_metrics_seed44.json", schema: "src/alphatrade/schemas/m2_train_metrics.schema.json", required: true}
      - {name: m4_eval_metrics_seed42, path: "m4_eval_metrics_seed42.json", schema: "src/alphatrade/schemas/m4_eval_metrics.schema.json", required: true}
      - {name: m4_eval_metrics_seed43, path: "m4_eval_metrics_seed43.json", schema: "src/alphatrade/schemas/m4_eval_metrics.schema.json", required: true}
      - {name: m4_eval_metrics_seed44, path: "m4_eval_metrics_seed44.json", schema: "src/alphatrade/schemas/m4_eval_metrics.schema.json", required: true}
  m5:
    description: "M5 sweep study. sweep_manifest + leaderboard + validation outputs."
    reports_dir: "reports"
    items:
      - {name: m5_sweep_manifest, path: "m5_sweep_manifest.json", schema: "src/alphatrade/schemas/m5_sweep_manifest.schema.json", required: true}
      - {name: m5_leaderboard, path: "m5_leaderboard.json", schema: "src/alphatrade/schemas/m5_leaderboard.schema.json", required: true}
      - {name: m5_leaderboard_md, path: "m5_leaderboard.md", schema: "", required: true}
      - {name: m5_schema_validation, path: "m5_schema_validation.json", schema: "", required: true}
      - {name: m5_schema_validation_md, path: "m5_schema_validation.md", schema: "", required: true}
  m6:
    description: "M6 baseline freeze. Frozen baseline × 3 seeds + summary."
    reports_dir: "reports"
    items:
      - {name: m5_sweep_manifest, path: "m5_sweep_manifest.json", schema: "src/alphatrade/schemas/m5_sweep_manifest.schema.json", required: true}
      - {name: m5_leaderboard, path: "m5_leaderboard.json", schema: "src/alphatrade/schemas/m5_leaderboard.schema.json", required: true}
      - {name: m5_leaderboard_md, path: "m5_leaderboard.md", schema: "", required: true}
      - {name: m5_schema_validation, path: "m5_schema_validation.json", schema: "", required: true}
      - {name: m5_schema_validation_md, path: "m5_schema_validation.md", schema: "", required: true}
      - {name: m6_baseline_run, path: "m6_baseline_run.md", schema: "", required: true}
  m7:
    description: "M7 ablation sweep. Baseline + ablations + regression report."
    reports_dir: "reports"
    items:
      - {name: m5_sweep_manifest, path: "m5_sweep_manifest.json", schema: "src/alphatrade/schemas/m5_sweep_manifest.schema.json", required: true}
      - {name: m5_leaderboard, path: "m5_leaderboard.json", schema: "src/alphatrade/schemas/m5_leaderboard.schema.json", required: true}
      - {name: m5_leaderboard_md, path: "m5_leaderboard.md", schema: "", required: true}
      - {name: m7_regression_report, path: "m7_regression_report.json", schema: "src/alphatrade/schemas/m7_regression_report.schema.json", required: true}
      - {name: m7_regression_report_md, path: "m7_regression_report.md", schema: "", required: true}
  m9:
    description: "M9 champion bundle + offline inference."
    reports_dir: "reports"
    items:
      - {name: m9_model_bundle_manifest, path: "m9_model_bundle_manifest.json", schema: "src/alphatrade/schemas/m9_model_bundle_manifest.schema.json", required: true}
      - {name: m9_infer_metrics, path: "m9_infer_metrics.json", schema: "src/alphatrade/schemas/m9_infer_metrics.schema.json", required: true}
      - {name: m9_infer_metrics_md, path: "m9_infer_metrics.md", schema: "", required: true}
      - {name: m9_predictions_parquet, path: "m9_predictions.parquet", schema: "", required: true}
  legacy_m2_m3:
    description: "Historical artifacts. Never blocks CI."
    reports_dir: "reports"
    items:
      - {name: m2_train_metrics, path: "m2_train_metrics.json", schema: "src/alphatrade/schemas/m2_train_metrics.schema.json", required: false}
      - {name: m2_universe_sweep, path: "m2_universe_sweep.json", schema: "src/alphatrade/schemas/m2_universe_sweep.schema.json", required: false}
      - {name: m2_t1_dataloader_check, path: "m2_t1_dataloader_check.json", schema: "src/alphatrade/schemas/m2_t1_dataloader_check.schema.json", required: false}
      - {name: m3_train_metrics, path: "m3_train_metrics.json", schema: "src/alphatrade/schemas/m2_train_metrics.schema.json", required: false}
