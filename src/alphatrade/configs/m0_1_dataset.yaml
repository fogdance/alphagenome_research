# M0.1 dataset config (2 symbols) - archive -> canonical -> index -> train
dataset:
  name: "m0_1"
  processed_root: "data/processed/m0_1"

archive:
  provider: "JUEJIN"
  archive_dir: "/data/juejin"
  manifest_path: ""  # Auto-detect if empty

symbols:
  - "DCE.JM"
  - "SHFE.RB"

canonical:
  gap_seconds: 1800
  min_segment_len: 30
  max_segment_len: 150
  eps: 1.0e-12
  cast_float: "float32"

features:
  - "ret_1m"
  - "hl_range"
  - "co_change"
  - "vol_log1p"
  - "pos_log1p"
  - "minute_sin"
  - "minute_cos"
  - "is_open"

sampling:
  lookback: 60
  stride: 5
  horizons: [1, 5, 20, 60]
  require_same_segment: true

time_split:
  train:
    start: "2018-01-01"
    end: "2024-01-01"
  val:
    start: "2024-01-01"
    end: "2025-01-01"
  test:
    start: "2025-01-01"
    end: "2026-01-01"
