      normalized_geometry_fields: {fields: [peak_level_dispersion_norm, trough_depth_norm, formation_symmetry, neckline_slope_norm], allowed_units: [ATR_MULTIPLE, REALIZED_VOL_MULTIPLE, TRAIN_FROZEN_SCALE_MULTIPLE, DIMENSIONLESS_RATIO], parameter_refs: [double_top.geometry_policy], assumption_ids: [MG1A.DOUBLE_TOP.STRUCTURE.001, MG1A.COMMON.NORMALIZATION.001]}
      duration_ratios: {fields: [left_peak_to_trough_duration_ratio, trough_to_right_peak_duration_ratio, formation_duration_to_scale_ratio], unit: SCALE_WINDOW_STATISTIC_RATIO, parameter_refs: [double_top.duration_policy], assumption_ids: [MG1A.DOUBLE_TOP.STRUCTURE.001, MG1A.COMMON.SCALE.001]}
