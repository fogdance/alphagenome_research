      prior_context_fields: {fields: [prior_trend_state, prior_trend_strength, volatility_regime, session_context, contract_roll_context, near_resistance_context], prefix_only: true, assumption_ids: [MG1A.DOUBLE_TOP.STRUCTURE.001, MG1A.COMMON.SESSION.001, MG1A.COMMON.ROLL.001]}
