      invalidation_fields: {fields: [peak_zone_upside_breach_state, neckline_break_absence_expiry_state, anchor_order_invalid_state], prefix_only: true, assumption_ids: [MG1A.DOUBLE_TOP.INVALIDATION.001]}
      optional_volume_oi_confirmations: {separate_from_topology: true, required_for_topology: false, fields: [left_vs_right_peak_volume_ratio, neckline_break_volume_relative, break_open_interest_change], assumption_ids: [MG1A.DOUBLE_TOP.CONFIRMATION.001, MG1A.COMMON.FILTER_MISSINGNESS.001]}
      label_provenance: *family_label_provenance
      assumption_ids: [MG1A.DOUBLE_TOP.STRUCTURE.001, MG1A.DOUBLE_TOP.PHASE.001, MG1A.DOUBLE_TOP.CONFIRMATION.001, MG1A.DOUBLE_TOP.INVALIDATION.001, MG1A.COMMON.ZONE.001, MG1A.COMMON.SCALE.001]
    - family: double_bottom
      side: BULLISH
      allowed_instance_sides: [BULLISH]
      instance_side_basis: FIXED_FAMILY_SIDE
      scale_id: INSTANCE_PARAMETER
      base_timeframe: INSTANCE_PARAMETER
