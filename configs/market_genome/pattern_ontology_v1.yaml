schema_version: mg1a.pattern_ontology.v1
profile: mg1a
milestone: MG1-A
decision: DRAFT_NEEDS_HUMAN_FREEZE
human_review:
  status: PENDING
  frozen: false
  approver: null
  approved_at: null
  frozen_sha256: null
resolved_contract:
  ontology_id: market_genome_pattern_ontology
  ontology_version: v1-draft
  contract_status: PARAMETERIZED_REVIEW_DRAFT
  common_lifecycle:
    phases:
      - INACTIVE
      - CANDIDATE
      - DEVELOPING
      - MATURE
      - CONFIRMED
      - RETEST_OR_CONTINUATION
      - COMPLETED
      - INVALIDATED
    transitions:
      - {from_phase: INACTIVE, to_phase: CANDIDATE, assumption_ids: [MG1A.COMMON.LIFECYCLE.001]}
      - {from_phase: CANDIDATE, to_phase: DEVELOPING, assumption_ids: [MG1A.COMMON.LIFECYCLE.001]}
      - {from_phase: DEVELOPING, to_phase: MATURE, assumption_ids: [MG1A.COMMON.LIFECYCLE.001]}
      - {from_phase: MATURE, to_phase: CONFIRMED, assumption_ids: [MG1A.COMMON.LIFECYCLE.001]}
      - {from_phase: CONFIRMED, to_phase: RETEST_OR_CONTINUATION, assumption_ids: [MG1A.COMMON.LIFECYCLE.001]}
      - {from_phase: RETEST_OR_CONTINUATION, to_phase: COMPLETED, assumption_ids: [MG1A.COMMON.LIFECYCLE.001]}
      - {from_phase: CANDIDATE, to_phase: INVALIDATED, assumption_ids: [MG1A.COMMON.LIFECYCLE.001]}
      - {from_phase: DEVELOPING, to_phase: INVALIDATED, assumption_ids: [MG1A.COMMON.LIFECYCLE.001]}
      - {from_phase: MATURE, to_phase: INVALIDATED, assumption_ids: [MG1A.COMMON.LIFECYCLE.001]}
      - {from_phase: CONFIRMED, to_phase: INVALIDATED, assumption_ids: [MG1A.COMMON.LIFECYCLE.001]}
      - {from_phase: RETEST_OR_CONTINUATION, to_phase: INVALIDATED, assumption_ids: [MG1A.COMMON.LIFECYCLE.001]}
      - {from_phase: COMPLETED, to_phase: INACTIVE, assumption_ids: [MG1A.COMMON.LIFECYCLE.001]}
      - {from_phase: INVALIDATED, to_phase: INACTIVE, assumption_ids: [MG1A.COMMON.LIFECYCLE.001]}
  scale_contract:
    scale_id: INSTANCE_PARAMETER
    base_timeframe: INSTANCE_PARAMETER
    family_definition_scale_invariant: true
    shared_across_scales: [anchor_roles, topology_constraints, phase_contract, normalization_contract]
    scale_specific_parameters: [noise_tolerance_ref, minimum_duration_ref, optional_filter_strength_ref]
    assumption_ids: [MG1A.COMMON.SCALE.001]
  normalization_contract:
    price_units: [ATR_MULTIPLE, REALIZED_VOL_MULTIPLE, TRAIN_FROZEN_SCALE_MULTIPLE, DIMENSIONLESS_RATIO]
    duration_unit: SCALE_WINDOW_STATISTIC_RATIO
    parameter_freeze_policy: TRAIN_FROZEN
    absolute_thresholds_allowed: false
    assumption_ids: [MG1A.COMMON.NORMALIZATION.001]
  anchor_instance_contract:
    required_fields: [role, event_eob, available_as_of_eob, normalized_price, scale_id, source_method, source_bar_closed, anchor_state, label_provenance, assumption_ids]
    event_availability_order: AVAILABLE_AS_OF_NOT_BEFORE_EVENT
    online_use_rule: AVAILABLE_AS_OF_NOT_AFTER_OBSERVATION
    partial_bar_policy: INSTANCE_PARAMETER
    assumption_ids: [MG1A.COMMON.SWING_CAUSALITY.001, MG1A.COMMON.PARTIAL_BAR.001]
  pattern_instance_contract:
    required_fields: [pattern_id, family, side, scale_id, base_timeframe, start_eob, as_of_eob, phase_observed_at, phase, anchors, topology, normalized_geometry, duration_ratios, price_ratios, prior_context, online_confirmation, invalidation, maturity_score, label_provenance, detector_version, assumption_ids, session_calendar_version, active_contract, roll_state]
    target_namespaces_separate: true
    target_fields: [retrospective_completion_target, future_outcome_target]
    assumption_ids: [MG1A.COMMON.SESSION.001, MG1A.COMMON.ROLL.001, MG1A.COMMON.LABEL_TIMING.001]
  label_namespaces:
    online_causal_phase:
      information_cutoff: PREFIX_THROUGH_AS_OF
      runtime_input_allowed: false
      target_only: false
      fields: [family, phase, phase_observed_at, maturity_score]
      assumption_ids: [MG1A.COMMON.LABEL_TIMING.001]
    retrospective_completion:
      information_cutoff: FUTURE_ALLOWED_TARGET_ONLY
      runtime_input_allowed: false
      target_only: true
      fields: [completion_status, completed_at, final_phase]
      assumption_ids: [MG1A.COMMON.LABEL_TIMING.001]
    future_outcome:
      information_cutoff: POST_CONFIRMATION_FUTURE_TARGET_ONLY
      runtime_input_allowed: false
      target_only: true
      fields: [target_class, target_horizon]
      assumption_ids: [MG1A.COMMON.LABEL_TIMING.001]
  label_provenance_contract:
    allowed_values: [RULE_DERIVED, HUMAN_REVIEWED, SYNTHETIC, AUTO_MODEL_ASSISTED]
    auto_model_assisted_independent_truth_allowed: false
    human_corrections_overwrite_engine_fields: false
    assumption_ids: [MG1A.COMMON.PROVENANCE.001]
  families:
    - family: trend_up
      side: BULLISH
      allowed_instance_sides: [BULLISH]
      instance_side_basis: FIXED_FAMILY_SIDE
      scale_id: INSTANCE_PARAMETER
      base_timeframe: INSTANCE_PARAMETER
      review_status: NEEDS_HUMAN_REVIEW
      anchor_roles:
        - {role: trend_origin_low, cardinality: ONE, assumption_ids: [MG1A.TREND_UP.STRUCTURE.001]}
        - {role: swing_high, cardinality: ONE_OR_MORE, assumption_ids: [MG1A.TREND_UP.STRUCTURE.001]}
        - {role: pullback_low, cardinality: ONE_OR_MORE, assumption_ids: [MG1A.TREND_UP.STRUCTURE.001]}
        - {role: current_frontier, cardinality: ONE, assumption_ids: [MG1A.TREND_UP.STRUCTURE.001]}
      phase_contract: &common_family_phase_contract
        allowed_phase_sequence: [INACTIVE, CANDIDATE, DEVELOPING, MATURE, CONFIRMED, RETEST_OR_CONTINUATION, COMPLETED, INVALIDATED]
        common_mapping:
          - {family_phase: INACTIVE, common_phase: INACTIVE}
          - {family_phase: CANDIDATE, common_phase: CANDIDATE}
          - {family_phase: DEVELOPING, common_phase: DEVELOPING}
          - {family_phase: MATURE, common_phase: MATURE}
          - {family_phase: CONFIRMED, common_phase: CONFIRMED}
          - {family_phase: RETEST_OR_CONTINUATION, common_phase: RETEST_OR_CONTINUATION}
          - {family_phase: COMPLETED, common_phase: COMPLETED}
          - {family_phase: INVALIDATED, common_phase: INVALIDATED}
        assumption_ids: [MG1A.TREND_UP.PHASE.001]
      topology_constraints:
        - {relation: TEMPORALLY_ALTERNATES, anchor_roles: [swing_high, pullback_low], parameter_refs: [trend_up.sequence_order_policy], assumption_ids: [MG1A.TREND_UP.STRUCTURE.001]}
        - {relation: SUCCESSIVE_HIGH_AND_LOW_ASCENDING, anchor_roles: [swing_high, pullback_low], parameter_refs: [trend_up.normalized_order_tolerance], assumption_ids: [MG1A.TREND_UP.STRUCTURE.001]}
      normalized_geometry_fields: {fields: [high_envelope_slope_norm, low_envelope_slope_norm, channel_width_norm, path_efficiency], allowed_units: [ATR_MULTIPLE, REALIZED_VOL_MULTIPLE, TRAIN_FROZEN_SCALE_MULTIPLE, DIMENSIONLESS_RATIO], parameter_refs: [trend_up.geometry_policy], assumption_ids: [MG1A.TREND_UP.STRUCTURE.001, MG1A.COMMON.NORMALIZATION.001]}
      duration_ratios: {fields: [formation_duration_to_scale_ratio, impulse_to_pullback_duration_ratio_profile], unit: SCALE_WINDOW_STATISTIC_RATIO, parameter_refs: [trend_up.duration_policy], assumption_ids: [MG1A.TREND_UP.STRUCTURE.001, MG1A.COMMON.SCALE.001]}
      price_ratios: {fields: [higher_high_increment_to_scale_ratio_profile, pullback_depth_to_prior_impulse_ratio], unit: DIMENSIONLESS_RATIO, parameter_refs: [trend_up.price_ratio_policy], assumption_ids: [MG1A.TREND_UP.STRUCTURE.001, MG1A.COMMON.NORMALIZATION.001]}
      prior_context_fields: {fields: [prior_family, prior_phase, volatility_regime, session_context, contract_roll_context, parent_scale_trend_state], prefix_only: true, assumption_ids: [MG1A.TREND_UP.STRUCTURE.001, MG1A.COMMON.SESSION.001, MG1A.COMMON.ROLL.001]}
      online_confirmation_fields: {fields: [ascending_high_sequence_state, ascending_low_sequence_state, latest_pullback_hold_state, anchor_sequence_completeness], prefix_only: true, assumption_ids: [MG1A.TREND_UP.CONFIRMATION.001]}
      invalidation_fields: {fields: [last_confirmed_pullback_low_breach_state, ascending_order_break_state, formation_expiry_state], prefix_only: true, assumption_ids: [MG1A.TREND_UP.INVALIDATION.001]}
      optional_volume_oi_confirmations: {separate_from_topology: true, required_for_topology: false, fields: [impulse_volume_relative_profile, pullback_volume_relative_profile, impulse_open_interest_change_profile], assumption_ids: [MG1A.TREND_UP.CONFIRMATION.001, MG1A.COMMON.FILTER_MISSINGNESS.001]}
      label_provenance: &family_label_provenance
        allowed_values: [RULE_DERIVED, HUMAN_REVIEWED, SYNTHETIC, AUTO_MODEL_ASSISTED]
        assumption_ids: [MG1A.COMMON.PROVENANCE.001]
      assumption_ids: [MG1A.TREND_UP.STRUCTURE.001, MG1A.TREND_UP.PHASE.001, MG1A.TREND_UP.CONFIRMATION.001, MG1A.TREND_UP.INVALIDATION.001, MG1A.COMMON.SCALE.001, MG1A.COMMON.NORMALIZATION.001]
    - family: trend_down
      side: BEARISH
      allowed_instance_sides: [BEARISH]
      instance_side_basis: FIXED_FAMILY_SIDE
      scale_id: INSTANCE_PARAMETER
      base_timeframe: INSTANCE_PARAMETER
      review_status: NEEDS_HUMAN_REVIEW
      anchor_roles:
        - {role: trend_origin_high, cardinality: ONE, assumption_ids: [MG1A.TREND_DOWN.STRUCTURE.001]}
        - {role: swing_low, cardinality: ONE_OR_MORE, assumption_ids: [MG1A.TREND_DOWN.STRUCTURE.001]}
        - {role: reaction_high, cardinality: ONE_OR_MORE, assumption_ids: [MG1A.TREND_DOWN.STRUCTURE.001]}
        - {role: current_frontier, cardinality: ONE, assumption_ids: [MG1A.TREND_DOWN.STRUCTURE.001]}
      phase_contract:
        <<: *common_family_phase_contract
        assumption_ids: [MG1A.TREND_DOWN.PHASE.001]
      topology_constraints:
        - {relation: TEMPORALLY_ALTERNATES, anchor_roles: [swing_low, reaction_high], parameter_refs: [trend_down.sequence_order_policy], assumption_ids: [MG1A.TREND_DOWN.STRUCTURE.001]}
        - {relation: SUCCESSIVE_LOW_AND_HIGH_DESCENDING, anchor_roles: [swing_low, reaction_high], parameter_refs: [trend_down.normalized_order_tolerance], assumption_ids: [MG1A.TREND_DOWN.STRUCTURE.001]}
      normalized_geometry_fields: {fields: [low_envelope_slope_norm, high_envelope_slope_norm, channel_width_norm, path_efficiency], allowed_units: [ATR_MULTIPLE, REALIZED_VOL_MULTIPLE, TRAIN_FROZEN_SCALE_MULTIPLE, DIMENSIONLESS_RATIO], parameter_refs: [trend_down.geometry_policy], assumption_ids: [MG1A.TREND_DOWN.STRUCTURE.001, MG1A.COMMON.NORMALIZATION.001]}
      duration_ratios: {fields: [formation_duration_to_scale_ratio, impulse_to_reaction_duration_ratio_profile], unit: SCALE_WINDOW_STATISTIC_RATIO, parameter_refs: [trend_down.duration_policy], assumption_ids: [MG1A.TREND_DOWN.STRUCTURE.001, MG1A.COMMON.SCALE.001]}
      price_ratios: {fields: [lower_low_increment_to_scale_ratio_profile, reaction_depth_to_prior_impulse_ratio], unit: DIMENSIONLESS_RATIO, parameter_refs: [trend_down.price_ratio_policy], assumption_ids: [MG1A.TREND_DOWN.STRUCTURE.001, MG1A.COMMON.NORMALIZATION.001]}
      prior_context_fields: {fields: [prior_family, prior_phase, volatility_regime, session_context, contract_roll_context, parent_scale_trend_state], prefix_only: true, assumption_ids: [MG1A.TREND_DOWN.STRUCTURE.001, MG1A.COMMON.SESSION.001, MG1A.COMMON.ROLL.001]}
      online_confirmation_fields: {fields: [descending_low_sequence_state, descending_high_sequence_state, latest_reaction_hold_state, anchor_sequence_completeness], prefix_only: true, assumption_ids: [MG1A.TREND_DOWN.CONFIRMATION.001]}
      invalidation_fields: {fields: [last_confirmed_reaction_high_breach_state, descending_order_break_state, formation_expiry_state], prefix_only: true, assumption_ids: [MG1A.TREND_DOWN.INVALIDATION.001]}
      optional_volume_oi_confirmations: {separate_from_topology: true, required_for_topology: false, fields: [impulse_volume_relative_profile, reaction_volume_relative_profile, impulse_open_interest_change_profile], assumption_ids: [MG1A.TREND_DOWN.CONFIRMATION.001, MG1A.COMMON.FILTER_MISSINGNESS.001]}
      label_provenance: *family_label_provenance
      assumption_ids: [MG1A.TREND_DOWN.STRUCTURE.001, MG1A.TREND_DOWN.PHASE.001, MG1A.TREND_DOWN.CONFIRMATION.001, MG1A.TREND_DOWN.INVALIDATION.001, MG1A.COMMON.MIRROR.001, MG1A.COMMON.SCALE.001]
    - family: trend_transition
      side: INSTANCE_PARAMETER
      allowed_instance_sides: [BULLISH, BEARISH]
      instance_side_basis: COUNTER_SEQUENCE_DIRECTION
      scale_id: INSTANCE_PARAMETER
      base_timeframe: INSTANCE_PARAMETER
      review_status: NEEDS_HUMAN_REVIEW
      anchor_roles:
        - {role: prior_sequence_terminal_extreme, cardinality: ONE, assumption_ids: [MG1A.TREND_TRANSITION.STRUCTURE.001]}
        - {role: last_defending_pivot, cardinality: ONE, assumption_ids: [MG1A.TREND_TRANSITION.STRUCTURE.001]}
        - {role: structure_break, cardinality: ONE, assumption_ids: [MG1A.TREND_TRANSITION.STRUCTURE.001]}
        - {role: first_counter_pivot, cardinality: ONE, assumption_ids: [MG1A.TREND_TRANSITION.STRUCTURE.001]}
        - {role: transition_retest, cardinality: ZERO_OR_ONE, assumption_ids: [MG1A.TREND_TRANSITION.STRUCTURE.001]}
      phase_contract:
        <<: *common_family_phase_contract
        assumption_ids: [MG1A.TREND_TRANSITION.PHASE.001]
      topology_constraints:
        - {relation: PRIOR_SEQUENCE_LOSES_ORDER, anchor_roles: [prior_sequence_terminal_extreme, last_defending_pivot], parameter_refs: [trend_transition.order_loss_policy], assumption_ids: [MG1A.TREND_TRANSITION.STRUCTURE.001]}
        - {relation: STRUCTURE_BREAK_CROSSES_LAST_DEFENDING_PIVOT, anchor_roles: [last_defending_pivot, structure_break], parameter_refs: [trend_transition.break_and_counter_policy], assumption_ids: [MG1A.TREND_TRANSITION.STRUCTURE.001]}
        - {relation: COUNTER_SEQUENCE_EMERGES_AFTER_BREAK, anchor_roles: [structure_break, first_counter_pivot, transition_retest], parameter_refs: [trend_transition.break_and_counter_policy], assumption_ids: [MG1A.TREND_TRANSITION.STRUCTURE.001]}
      normalized_geometry_fields: {fields: [prior_envelope_slope_norm, transition_displacement_norm, counter_swing_strength_norm], allowed_units: [ATR_MULTIPLE, REALIZED_VOL_MULTIPLE, TRAIN_FROZEN_SCALE_MULTIPLE, DIMENSIONLESS_RATIO], parameter_refs: [trend_transition.geometry_policy], assumption_ids: [MG1A.TREND_TRANSITION.STRUCTURE.001, MG1A.COMMON.NORMALIZATION.001]}
      duration_ratios: {fields: [transition_duration_to_prior_trend_ratio, break_to_counter_pivot_duration_ratio], unit: SCALE_WINDOW_STATISTIC_RATIO, parameter_refs: [trend_transition.duration_policy], assumption_ids: [MG1A.TREND_TRANSITION.STRUCTURE.001, MG1A.COMMON.SCALE.001]}
      price_ratios: {fields: [break_displacement_to_prior_swing_ratio, counter_swing_to_prior_impulse_ratio], unit: DIMENSIONLESS_RATIO, parameter_refs: [trend_transition.price_ratio_policy], assumption_ids: [MG1A.TREND_TRANSITION.STRUCTURE.001, MG1A.COMMON.NORMALIZATION.001]}
      prior_context_fields: {fields: [prior_trend_family, prior_trend_phase, volatility_regime, session_context, contract_roll_context, parent_scale_trend_state], prefix_only: true, assumption_ids: [MG1A.TREND_TRANSITION.STRUCTURE.001, MG1A.COMMON.SESSION.001, MG1A.COMMON.ROLL.001]}
      online_confirmation_fields: {fields: [prior_order_loss_state, defending_pivot_break_state, counter_sequence_state, transition_retest_state], prefix_only: true, assumption_ids: [MG1A.TREND_TRANSITION.CONFIRMATION.001]}
      invalidation_fields: {fields: [prior_trend_resumption_state, defending_pivot_recovery_state, counter_sequence_failure_state], prefix_only: true, assumption_ids: [MG1A.TREND_TRANSITION.INVALIDATION.001]}
      optional_volume_oi_confirmations: {separate_from_topology: true, required_for_topology: false, fields: [break_volume_relative, break_open_interest_change, counter_leg_volume_profile], assumption_ids: [MG1A.TREND_TRANSITION.CONFIRMATION.001, MG1A.COMMON.FILTER_MISSINGNESS.001]}
      label_provenance: *family_label_provenance
      assumption_ids: [MG1A.TREND_TRANSITION.STRUCTURE.001, MG1A.TREND_TRANSITION.PHASE.001, MG1A.TREND_TRANSITION.CONFIRMATION.001, MG1A.TREND_TRANSITION.INVALIDATION.001, MG1A.COMMON.OVERLAP.001, MG1A.COMMON.SCALE.001]
    - family: double_top
      side: BEARISH
      allowed_instance_sides: [BEARISH]
      instance_side_basis: FIXED_FAMILY_SIDE
      scale_id: INSTANCE_PARAMETER
      base_timeframe: INSTANCE_PARAMETER
      review_status: NEEDS_HUMAN_REVIEW
      anchor_roles:
        - {role: left_peak, cardinality: ONE, assumption_ids: [MG1A.DOUBLE_TOP.STRUCTURE.001]}
        - {role: intervening_trough, cardinality: ONE, assumption_ids: [MG1A.DOUBLE_TOP.STRUCTURE.001]}
        - {role: right_peak, cardinality: ONE, assumption_ids: [MG1A.DOUBLE_TOP.STRUCTURE.001]}
        - {role: neckline_zone, cardinality: DERIVED_ONE, assumption_ids: [MG1A.DOUBLE_TOP.STRUCTURE.001]}
        - {role: neckline_break, cardinality: ZERO_OR_ONE, assumption_ids: [MG1A.DOUBLE_TOP.STRUCTURE.001]}
        - {role: neckline_retest, cardinality: ZERO_OR_ONE, assumption_ids: [MG1A.DOUBLE_TOP.STRUCTURE.001]}
