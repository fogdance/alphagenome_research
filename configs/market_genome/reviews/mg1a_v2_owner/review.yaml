- assumption_id: MG1A1.COMMON.SCALE_SPEC.001
  owner_decision: REQUEST_REVISION
  owner_rationale: Freeze the versioned ScaleSpec interface now while deferring concrete calendars, per-timeframe parameter
    values, normalization, and train-fitted values.
  required_changes:
  - Require every formal object to reference a content-addressed scale registry entry containing timeframe identity, bar resolution,
    aggregation policy, session and calendar version, canonical detector version and hash, and effective parameter-profile
    version and hash.
  - Detect every timeframe independently and assign independent pattern identities; never promote a lower-timeframe pattern
    to a higher-timeframe label.
  - Keep family topology shared where the canonical algorithm is shared, while allowing separately versioned effective parameter
    profiles per timeframe.
  - Keep formation-span observations on the object's own timeframe and do not use encoder scale metadata as family identity.
  - Defer concrete trading calendars, timeframe parameter values, normalization, and train-fitted values without running training
    or GPU work in MG1-A.
  - Block formal label generation for any timeframe whose required registry entry or effective detector profile is absent,
    unresolved, or hash-mismatched; do not block ontology schema freeze solely because those values are deferred.
  - Prohibit test-set selection or tuning and require a new versioned profile for every later parameter change.
