- assumption_id: MG1A.COMMON.ROLL.001
  owner_decision: REQUEST_REVISION
  owner_rationale: The data source must switch discretely at the roll boundary; all pre-roll bars use the outgoing contract
    and all bars from the boundary onward use the incoming contract.
  required_changes:
  - Define a roll event with an exact effective closed-bar boundary, outgoing contract ID, and incoming contract ID.
  - Require every bar before the boundary to come only from the outgoing contract and every bar at or after the boundary to
    come only from the incoming contract.
  - Prohibit blending two contracts within one bar and persist active_contract_id and roll_event_id with the data.
  - Terminate every active pattern instance at the roll boundary, prohibit cross-roll anchors, and start pattern recognition
    anew on the incoming contract.
  - Use each active contract's raw OHLC prices for pattern recognition; do not use an adjusted continuous series.
  evidence_needed_to_resume: []
  replacement_proposition: []
  reviewed_at: '2026-07-13T20:33:59+08:00'
- assumption_id: MG1A.COMMON.PROVENANCE.001
  owner_decision: REQUEST_REVISION
  owner_rationale: All official shape labels for training and evaluation must be generated by one unified, versioned recognition
    algorithm; human confirmation is optional and evaluated models cannot generate their own targets.
  required_changes:
  - Define one canonical pattern-recognition algorithm as the sole generator of official training and evaluation shape labels.
  - Bind every official label set to the detector identity, version, configuration hash, algorithm artifact hash, and evidence
    snapshot.
  - Keep AI, model, program, or human proposals in a separate advisory namespace unless the canonical algorithm produces the
    official label.
  - Record human confirmation as optional metadata without changing the canonical algorithm provenance.
  - Prohibit any trained or evaluated model from generating its own official target labels.
  - Publish an immutable new label-set version when the canonical algorithm changes; do not overwrite prior labels.
  evidence_needed_to_resume: []
  replacement_proposition: []
  reviewed_at: '2026-07-13T20:38:32+08:00'
- assumption_id: MG1A.COMMON.MIRROR.001
  owner_decision: REQUEST_REVISION
  owner_rationale: Every mirrored pair must share both its structure and parameters exactly, with only the directional, high-low,
    and breakout-orientation transformations applied.
  required_changes:
  - Define a normative mirror-pair table for trend direction, double top and bottom, head-and-shoulders top and bottom, and
    directional level events.
  - Define exact mirrored transforms for anchors, phase events, invalidations, orientations, semantic roles, formulas, and
    relations.
  - Require both members of a mirror pair to reference the same parameter set within the same timeframe and registry version.
  - Apply parameter changes atomically to both members and reject any mirror-pair parameter drift.
  - Keep recognition independent across timeframes while enforcing mirror equality inside each timeframe.
