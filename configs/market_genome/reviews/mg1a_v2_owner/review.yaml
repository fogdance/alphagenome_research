- assumption_id: MG1A1.COMMON.FORMULA_CONTRACT.001
  owner_decision: REQUEST_REVISION
  owner_rationale: Allow deterministic numeric thresholds required by the selected canonical detectors, while keeping every
    effective value versioned, content-addressed, scale-specific, and isolated from test-data tuning.
  required_changes:
  - Permit deterministic canonical-detector numeric thresholds and time windows only through the effective versioned parameter
    profile bound to the object's timeframe, detector version, and content hash.
  - Use raw prices for all pattern-recognition predicates and keep every comparison operator, boundary convention, equality
    behavior, and closed-bar timing explicit.
  - Require each derived geometry feature formula to declare typed numerator, denominator, sign, unit, missingness, clipping
    policy, fit boundary, and assumption lineage separately from recognition predicates.
  - Defer normalization, train-fitted clipping values, and other training-derived transforms until the training-data and normalization
    scheme is reviewed; none may alter canonical formal labels.
  - Prohibit fitting, selecting, or tuning detector thresholds, normalization, or clipping rules on test or evaluation data.
  - Treat missing futures volume or open interest as a source-data error rather than a valid market observation.
  - Permit explicit validity masks for genuinely inapplicable or insufficient-history derived features, without converting
    those masks into missing raw-market-data semantics.
