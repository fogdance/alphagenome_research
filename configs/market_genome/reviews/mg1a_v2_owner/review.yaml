- assumption_id: MG1A.DOUBLE_TOP.PHASE.001
  owner_decision: REQUEST_REVISION
  owner_rationale: Map the canonical detector's causal candidate state into the common four-state lifecycle without inventing
    intermediate phases that the algorithm does not emit.
  required_changes:
  - UNACTIVATED means no causally available H-L-H candidate exists; partial anchors may be retained only as evidence.
  - ACTIVE begins when the right peak is confirmed and the complete H-L-H candidate passes the canonical geometry rules.
  - COMPLETED begins on the closed-bar neckline-break confirmation event.
  - INVALIDATED begins when an active candidate is invalidated, expires, or is superseded; a replacement candidate receives
    a new stable identity.
  - Keep post-confirmation failed-breakdown, target-hit, full-failure, and ambiguous results as separately timed outcomes;
    they must not rewrite the completed pattern lifecycle or confirmation time.
  evidence_needed_to_resume: []
  replacement_proposition: []
