- assumption_id: MG1A.COMMON.SCALE.001
  owner_decision: REQUEST_REVISION
  owner_rationale: Each timeframe must detect and record technical patterns independently; a lower-timeframe pattern is not
    a higher-timeframe pattern merely because it falls inside one higher-timeframe bar.
  required_changes:
  - Run pattern recognition independently on the closed bars of every registered timeframe.
  - Preserve the detecting timeframe as part of each pattern instance identity; do not promote, collapse, or relabel a lower-timeframe
    pattern as a higher-timeframe pattern.
  - Require a higher-timeframe pattern to satisfy the same family definition using that timeframe's own bars and anchors.
  - Keep any cross-timeframe association as a separate optional relationship that cannot change either pattern's scale identity.
  - Define the legal timeframe registry, session-aligned bar construction, and detection parameters for each timeframe.
  evidence_needed_to_resume: []
  replacement_proposition: []
  reviewed_at: '2026-07-13T20:23:44+08:00'
