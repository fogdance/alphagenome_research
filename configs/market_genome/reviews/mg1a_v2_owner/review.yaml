    and family contracts.
  - Allow UNACTIVATED_TO_ACTIVE, ACTIVE_TO_ACTIVE, ACTIVE_TO_COMPLETED, ACTIVE_TO_INVALIDATED, and the event-object-specific
    UNACTIVATED_TO_COMPLETED transition.
  - Instantiate FAILED_BREAKOUT directly as COMPLETED at its canonical reentry event without persisting an artificial ACTIVE
    phase.
  - Keep confirmed BREAKOUT and its source RANGE ACTIVE until the versioned failure window closes, then complete both; inside
    the window invalidate the attempt and keep the source range active.
  - Bind every family transition to its reviewed closed-bar predicate, threshold, time window, evidence priority, and canonical
    detector profile.
  - Require each family to implement only its applicable edges; do not require every family to emit every common edge.
  - Remove all lifecycle mappings for TREND_TRANSITION, RETEST, and SUPPORT_RESISTANCE_CONVERSION.
  - Keep COMPLETED and INVALIDATED immutable; any later shape requires a new pattern identity, while data or algorithm corrections
    use append-only replacement provenance.
