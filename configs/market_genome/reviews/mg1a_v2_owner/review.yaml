- assumption_id: MG1A.COMMON.ZONE.001
  owner_decision: REQUEST_REVISION
  owner_rationale: Key price levels use price zones except for an explicitly registered canonical-algorithm exception; the
    time-varying HEAD_SHOULDERS_TOP and INVERSE_HEAD_SHOULDERS neckline follows its selected detector formula.
  required_changes:
  - Add a common versioned zone contract used by every pattern family and key price level unless an owner-reviewed algorithm-specific
    exception is registered.
  - Store zone identity, lower and upper bounds, reference center, source anchors, timeframe, construction method, and version.
  - Base recognition decisions on zone bounds rather than treating the reference center as an exact tradable line, except
    for a registered algorithm-specific dynamic-level rule.
  - Construct each zone independently per timeframe from related confirmed closed-bar pivots, using the lowest relevant pivot
    price as the lower bound and the highest as the upper bound.
  - When only one relevant pivot is available, initialize the zone from the low to the high of that pivot's closed bar.
  - Register the canonical dynamic scalar neckline from the shared head-and-shoulders algorithm as an explicit exception;
    do not expand it with pivot-bar Low-High values or replace it with a static zone.
  - Define exact touch, cross, penetration, hold, rejection, reclaim, and full-recross predicates.
  - Define zone drift, material revision, merge, replacement, precedence, and expiry behavior.
  evidence_needed_to_resume: []
  replacement_proposition: []
  reviewed_at: '2026-07-13T20:46:59+08:00'
