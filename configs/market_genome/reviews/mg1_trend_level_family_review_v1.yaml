findings:
  - assumption_id: MG1A.TREND_UP.STRUCTURE.001
    disposition: REVISE
    expert_decision: >-
      Retain alternating highs and pullback lows with ascending order, but require
      an explicit sequence-readiness policy before the family can mature.
    approved_invariants: ["Trend-up topology requires ascending swing highs and pullback lows.", "Every compared anchor must be causally available."]
    resolved_parameter_refs: []
    wildcard_expansions: []
    required_changes: ["Define the minimum adjacent comparisons, order tolerance, and sequence readiness without fixing a data-derived threshold."]
    blocking_items: [SEQUENCE_READINESS_NOT_DEFINED, TREND_UP_GEOMETRY_POLICIES_UNRESOLVED]
    evidence_ids: [TECH_ONTOLOGY, CHENDAGE_TREND]

  - assumption_id: MG1A.TREND_UP.PHASE.001
    disposition: DEFER
    expert_decision: >-
      Phase names can follow the common lifecycle, but persistent-trend completion
      and new-object reset semantics must be selected before phase evidence is frozen.
    approved_invariants: ["Each phase transition is prefix-only.", "Completion and invalidation remain distinct terminal meanings."]
    resolved_parameter_refs: []
    wildcard_expansions: []
    required_changes: ["Define earliest evidence for all eight phases and persistent-trend completion."]
    blocking_items: [PERSISTENT_TREND_COMPLETION_UNRESOLVED, PHASE_WILDCARD_UNEXPANDED]
    evidence_ids: [TECH_LIFECYCLE]

  - assumption_id: MG1A.TREND_UP.CONFIRMATION.001
    disposition: REVISE
    expert_decision: >-
      Ascending sequence state, latest pullback hold, and sequence completeness are
      valid confirmation inputs; volume and OI remain optional filters.
    approved_invariants: ["Confirmation is causal and separate from topology.", "Optional filters cannot create trend topology."]
    resolved_parameter_refs: []
    wildcard_expansions: []
    required_changes: ["Define the confirmation truth table, UNKNOWN handling, and required sequence completeness."]
    blocking_items: [CONFIRMATION_WILDCARD_UNEXPANDED, FILTER_MISSINGNESS_UNRESOLVED]
    evidence_ids: [PLAN_MG1A]

  - assumption_id: MG1A.TREND_UP.INVALIDATION.001
    disposition: REVISE
    expert_decision: >-
      Retain confirmed-pullback breach, ascending-order break, and formation expiry,
      but bind each event to a versioned pivot and scale-relative observation policy.
    approved_invariants: ["Invalidation uses prefix-only evidence.", "A formation expiry is not a future outcome label."]
    resolved_parameter_refs: []
    wildcard_expansions: []
    required_changes: ["Define pivot selection, breach observation, expiry clock, and simultaneous-event priority."]
    blocking_items: [INVALIDATION_WILDCARD_UNEXPANDED, PIVOT_AND_EXPIRY_POLICY_UNRESOLVED]
    evidence_ids: [PLAN_MG1A]

  - assumption_id: MG1A.TREND_DOWN.STRUCTURE.001
    disposition: REVISE
    expert_decision: >-
      Retain alternating lows and reaction highs with descending order, using a
