    evidence_ids: [TECH_ONTOLOGY, CHENDAGE_TREND]

  - assumption_id: MG1A.TREND_TRANSITION.PHASE.001
    disposition: REVISE
    expert_decision: >-
      The original trend invalidation and transition candidate must share one causal
      break event; neither object may rewrite the other's historical phase.
    approved_invariants: ["Linked objects preserve independent lifecycle histories.", "Candidate phase begins no earlier than its required event availability."]
