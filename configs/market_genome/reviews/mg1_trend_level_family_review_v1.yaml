    approved_invariants: ["Trend-down topology requires descending swing lows and reaction highs.", "Mirroring does not imply shared numerical parameters."]
    resolved_parameter_refs: []
    wildcard_expansions: []
    required_changes: ["Define sequence readiness and enumerate the exact trend-up to trend-down role transform."]
    blocking_items: [SEQUENCE_READINESS_NOT_DEFINED, MIRROR_TRANSFORM_NOT_APPLIED]
    evidence_ids: [TECH_ONTOLOGY, CHENDAGE_TREND]

  - assumption_id: MG1A.TREND_DOWN.PHASE.001
