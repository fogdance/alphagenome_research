- assumption_id: MG1A.COMMON.SWING_CAUSALITY.001
  category: CAUSALITY
  question: Freeze anchor source methods and delay between event_eob and available_as_of_eob.
  affected_families:
  - ALL
  parameter_refs:
  - anchor_instance_contract
  source_evidence:
  - TECH_CAUSALITY
  - CHENDAGE_SWING
  review_state: REVIEWED
  disposition: REVISE
  freeze_gate: BLOCKED
  expert_decision: Enforce event_eob <= available_as_of_eob <= as_of_eob. An anchor may affect an online
    phase only after availability; its source method, source version, closed-bar state, tie rule, and
    revision policy must be recorded.
  approved_invariants:
  - Centered extrema are never backfilled as if known at their event bar.
  - Anchor availability is explicit and independently testable.
  - Pattern state cannot consume an anchor before available_as_of_eob.
  resolved_parameter_refs: []
  unresolved_parameter_refs:
  - anchor_instance_contract
  wildcard_expansions: []
  required_changes:
  - Define the allowed anchor-source registry and availability delay for each method.
  - Define tie handling, replacement, and retraction behavior.
  blocking_items:
  - ANCHOR_SOURCE_REGISTRY_NOT_DEFINED
  - ANCHOR_REVISION_POLICY_NOT_DEFINED
  evidence_ids:
  - TECH_CAUSALITY
  - CHENDAGE_SWING
  reviewer_id: CODEX_DOMAIN_EXPERT_01
  reviewed_at: '2026-07-13T16:59:26+08:00'
