  parameter_refs:
  - pattern_instance_contract.session_calendar_version
  source_evidence:
  - CHENDAGE_SESSION
  review_state: REVIEWED
  disposition: DEFER
  freeze_gate: BLOCKED
  expert_decision: Require a versioned authoritative calendar per instrument, deterministic session-to-trading-day
    mapping, and explicit masks for out-of-session and missing bars. No generic fallback calendar is acceptable
    for a frozen run. The repository does not yet provide the authoritative registry needed to select
    concrete calendar versions.
  approved_invariants:
  - Every instance names its session calendar version.
  - Missing and out-of-session bars are distinct from observed zero values.
  - Bucket boundaries are deterministic in the instrument exchange timezone.
  resolved_parameter_refs: []
  unresolved_parameter_refs:
  - pattern_instance_contract.session_calendar_version
  wildcard_expansions: []
  required_changes:
  - Provide an authoritative instrument-to-calendar registry with holiday and night-session rules.
  - Define missing-bar, early-close, timezone, and unsupported-instrument behavior.
  blocking_items:
