  parameter_refs:
  - scale_contract
  source_evidence:
  - PLAN_MG1A
  - TECH_MULTI_SCALE
  review_state: REVIEWED
  disposition: REVISE
  freeze_gate: BLOCKED
  expert_decision: Keep topology, anchor roles, phase ordering, and normalization form shared across scale.
    Supply scale_id and base_timeframe per instance; permit only noise tolerance, minimum duration, and
    optional-filter strength to vary by scale under a versioned train-only policy.
  approved_invariants:
  - A timeframe changes scale statistics, not family identity.
  - Scale-specific parameters cannot be selected using validation or test outcomes.
  - Every scale statistic is versioned and computed from causal observations.
  resolved_parameter_refs: []
