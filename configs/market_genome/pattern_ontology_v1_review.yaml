- assumption_id: MG1A.COMMON.NORMALIZATION.001
  category: NORMALIZATION
  question: Select the train-frozen price normalizer and its fitting boundary.
  affected_families:
  - ALL
  parameter_refs:
  - normalization_contract
  source_evidence:
  - PLAN_MG1A
  - CHENDAGE_LEVELS
  review_state: REVIEWED
  disposition: REVISE
  freeze_gate: BLOCKED
  expert_decision: Use dimensionless ratios directly and use a versioned causal volatility or train-frozen
    scale for price distances. Absolute point thresholds are prohibited. Any fitted transform is learned
    on the training partition only and then fixed for validation and test.
  approved_invariants:
  - Price geometry uses normalized multiples or dimensionless ratios.
  - Duration uses scale-window statistic ratios.
  - Online rolling statistics are prefix-only and fitted artifacts are train-only.
  resolved_parameter_refs: []
  unresolved_parameter_refs:
  - normalization_contract
  wildcard_expansions: []
  required_changes:
  - Bind each geometry field to one allowed normalization method.
  - Define lookback, stability floor, fit partition, artifact version, and hash requirements.
  blocking_items:
  - FIELD_NORMALIZER_BINDINGS_NOT_DEFINED
  - NORMALIZER_FIT_CONTRACT_NOT_DEFINED
