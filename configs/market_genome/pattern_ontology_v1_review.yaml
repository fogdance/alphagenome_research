  review_state: REVIEWED
  disposition: REVISE
  freeze_gate: BLOCKED
  expert_decision: Version 1 pattern anchors and phase transitions are closed-bar only. A partial aggregate
    may be exposed as separate provisional telemetry, but it cannot mutate committed pattern state or
