- assumption_id: MG1A.COMMON.LIFECYCLE.001
  category: PHASE
  question: Freeze common transitions, terminal reset behavior, and family-specific phase semantics.
  affected_families:
  - ALL
  parameter_refs:
  - common_lifecycle
  source_evidence:
  - PLAN_MG1A
  - TECH_LIFECYCLE
  review_state: REVIEWED
  disposition: REVISE
  freeze_gate: BLOCKED
  expert_decision: Retain the eight-phase causal lifecycle, but do not reset a terminal object to INACTIVE
    under the same pattern_id. Terminal objects remain immutable; a later formation creates a new object
    and may link to its predecessor.
  approved_invariants:
  - The eight common phase names remain the shared lifecycle vocabulary.
  - Online transitions use only evidence available at or before as_of_eob.
  - Any pre-terminal formation phase may transition to INVALIDATED.
  resolved_parameter_refs: []
  unresolved_parameter_refs:
  - common_lifecycle
  wildcard_expansions: []
  required_changes:
  - Remove same-object COMPLETED-to-INACTIVE and INVALIDATED-to-INACTIVE resets.
  - Define earliest causal evidence for each family phase and persistent-family completion.
  blocking_items:
  - OBJECT_ID_RESET_POLICY_NOT_APPLIED
  - FAMILY_PHASE_EVIDENCE_NOT_DEFINED
  evidence_ids:
  - PLAN_MG1A
  - TECH_LIFECYCLE
  reviewer_id: CODEX_DOMAIN_EXPERT_01
  reviewed_at: '2026-07-13T16:59:26+08:00'
- assumption_id: MG1A.COMMON.SCALE.001
  category: SCALE
  question: Freeze scale identifiers, scale-window statistics, and scale-specific parameter policy.
  affected_families:
