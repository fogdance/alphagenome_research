- assumption_id: MG1A.COMMON.ROLL.001
  category: CONTEXT
  question: Freeze active-contract, roll-boundary, adjustment, and contract-age semantics.
  affected_families:
  - ALL
  parameter_refs:
  - pattern_instance_contract.roll_state
  source_evidence:
  - ALPHATRADE_ROLL
  - CHENDAGE_ROLL_BOUNDARY
  review_state: REVIEWED
  disposition: REVISE
  freeze_gate: BLOCKED
  expert_decision: For version 1, a contract roll terminates every open pattern on the old active contract
    and new objects start on the new contract. Cross-roll anchors are prohibited. Continuous adjusted
    prices may be context, but active_contract, roll event, mapping version, and contract age remain explicit.
  approved_invariants:
  - Roll mapping is causal, versioned, and retained at bar and pattern level.
  - A roll cannot silently create, preserve, or invalidate an anchor.
  - Evaluation uses roll-aware embargo at split boundaries.
  resolved_parameter_refs: []
  unresolved_parameter_refs:
  - pattern_instance_contract.roll_state
  wildcard_expansions: []
  required_changes:
